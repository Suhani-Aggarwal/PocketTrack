<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>💳</text></svg>">

<title>Expenses</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>💰PocketTrack</h2>

        <ul>
            <li>
                <a href="start.html">
                    <span>🏠</span> Home
                </a>
            </li>

            <li class="active">
                <a href="expenses.html">
                    <span>💳</span> Expenses
                </a>
            </li>

            <li>
                <a href="analytics.html">
                    <span>📊</span> Analytics
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <span>⚙️</span> Settings
                </a>
            </li>
        </ul>

    </div>


    <!-- MAIN -->

    <div class="main">

        <div class="top-bar">
            <h2>💸 Ledger</h2>
        </div>


        <!-- TOTAL CARDS -->

        <div class="cards">

            <div class="card">
                <h3>You Will Get</h3>
                <p id="totalGive">₹0</p>
            </div>

            <div class="card">
                <h3>You Need To Pay</h3>
                <p id="totalTake">₹0</p>
            </div>

        </div>


        <div class="cards">

            <!-- ADD RECORD -->

            <div class="card">

                <h3>Add Record</h3>

                <label>Type</label>
                <select id="type">
                    <option value="lend">Lend</option>
                    <option value="borrow">Borrow</option>
                </select>

                <label>Person Name</label>
                <input type="text" id="person" placeholder="Enter name">

                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="Enter WhatsApp Number">

                <label>Amount</label>
                <input type="number" id="amount" placeholder="Enter amount">

                <label>Due Date</label>
                <input type="date" id="date">

                <button onclick="addDebt()">Add Record</button>

            </div>


            <!-- RECORD LIST -->

            <div class="card">

                <h3>Pending Payments</h3>

                <div class="payments-list" id="debtList">
                    
                </div>

            </div>

        </div>

    </div>

</div>

<script src="expenses.js"></script>

</body>
</html>
