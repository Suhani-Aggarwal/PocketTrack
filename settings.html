<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22> ⚙️ </text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<title>Settings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
<!-- SIDEBAR -->
<div class="sidebar">
<h2>💰PocketTrack</h2>
<ul>
<li>
<a href="start.html">
<span>🏠</span> Home
</a>
</li>
<li><a href="expenses.html">
<span>💳</span> Expenses</a>
</li>
<li>
<a href="analytics.html">
<span>📊</span> Analytics
</a>
</li>
<li class="active"><a href="settings.html">
<span>⚙️</span> Settings</a>
</li>
</ul>
</div>
<!-- MAIN -->
<div class="main">
<div class="top-bar">
<h1>Settings</h1>
</div>
<!-- APPEARANCE -->
<div class="card">
<h3>🎨 Appearance</h3>
<button onclick="toggleTheme()">Dark / Light Mode</button>
</div>
<!-- CURRENCY -->
<div class="card">
<h3>💱 Currency</h3>
<select id="currencySelect">
<option value="₹">INR (₹)</option>
<option value="$">USD ($)</option>
<option value="€">EUR (€)</option>
<option value="£">GBP (£)</option>
</select>
<button onclick="saveCurrency()">Save Currency</button>
</div>
<!-- TREND GRAPH DEFAULT -->
<div class="card">
<h3>📈 Default Trend Graph</h3>
<select id="trendDefault">
<option value="weekly">Weekly</option>
<option value="monthly">Monthly</option>
<option value="yearly">Yearly</option>
</select>
<button onclick="saveTrend()">Save Preference</button>
</div>
<!-- DATA MANAGEMENT -->
<div class="card">
<h3>💾 Data Management</h3>
<button onclick="exportJSON()">Export JSON</button>
<button onclick="exportPDF()">Export as PDF</button>
<button onclick="clearData()">Clear All Data</button>
</div>
<!-- LOGOUT -->
<div class="card">
  <button onclick="logout()">Logout</button>
</div>
<!-- Help and support -->
<div class="card">
  <button class="help-support">Help & Support</button>
</div>

<div class="support-box" id="supportBox">
  <h3>Help & Support</h3>

  <input type="email" id="userEmail" placeholder="Enter your Gmail">

  <textarea id="userIssue" placeholder="Describe your issue..."></textarea>

  <button id="sendMessage">Send Message</button>
  <button id="closeSupport">Close</button>
</div>
</div>
</div>
<script src="settings.js"></script>
</body>
</html>
